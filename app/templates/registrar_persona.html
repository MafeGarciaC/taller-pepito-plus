{% extends "base.html" %}
{% block title %}Registrar persona{% endblock %}

{% block content %}
<h1>Registrar persona a consultar</h1>
<p style="font-size:13px;color:#6b7280;">
    Los campos con <span class="obligatorio">*</span> son obligatorios (RF1).
</p>

<form method="POST" action="/personas/nueva">

    <label for="nombre_completo">Nombre completo <span class="obligatorio">*</span></label>
    <input type="text" id="nombre_completo" name="nombre_completo" required
           value="{{ form_data.nombre_completo if form_data else '' }}">

    <label for="pais">País <span class="obligatorio">*</span></label>
    <input type="text" id="pais" name="pais" required
           value="{{ form_data.pais if form_data else '' }}">

    <label for="ciudad">Ciudad</label>
    <input type="text" id="ciudad" name="ciudad"
           value="{{ form_data.ciudad if form_data else '' }}">

    <label for="profesion_cargo">Profesión o cargo</label>
    <input type="text" id="profesion_cargo" name="profesion_cargo"
           value="{{ form_data.profesion_cargo if form_data else '' }}">

    <label for="empresa_organizacion">Empresa u organización</label>
    <input type="text" id="empresa_organizacion" name="empresa_organizacion"
           value="{{ form_data.empresa_organizacion if form_data else '' }}">

    <label for="alias">Alias</label>
    <input type="text" id="alias" name="alias"
           value="{{ form_data.alias if form_data else '' }}">

    <label for="palabras_relacionadas">Palabras relacionadas (separadas por coma)</label>
    <textarea id="palabras_relacionadas" name="palabras_relacionadas" rows="3">{{ form_data.palabras_relacionadas if form_data else '' }}</textarea>

    <button type="submit">Registrar persona</button>
</form>
{% endblock %}
