<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#f9fafb"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">
    Diagrama de Infraestructura — Pepito Plus
  </text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#6b7280">
    Entorno de desarrollo local (single-node deployment)
  </text>

  <!-- Host machine box -->
  <rect x="60" y="80" width="560" height="420" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="80" y="105" font-size="13" font-weight="700" fill="#1f2937">Equipo local (Windows)</text>
  <text x="80" y="122" font-size="11" fill="#6b7280">Host: localhost / 127.0.0.1</text>

  <!-- Browser -->
  <rect x="90" y="140" width="220" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Navegador Web</text>
  <text x="200" y="188" text-anchor="middle" font-size="11" fill="#1e3a8a">Cliente (Chrome/Edge)</text>
  <text x="200" y="206" text-anchor="middle" font-size="10" fill="#1e3a8a">Consume la interfaz HTML</text>

  <!-- Flask server -->
  <rect x="360" y="140" width="230" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="475" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Servidor de aplicación</text>
  <text x="475" y="184" text-anchor="middle" font-size="11" fill="#14532d">Flask (Werkzeug dev server)</text>
  <text x="475" y="200" text-anchor="middle" font-size="10" fill="#14532d">Puerto :5000</text>
  <text x="475" y="216" text-anchor="middle" font-size="10" fill="#14532d">Pool de N workers (threads)</text>

  <line x1="310" y1="185" x2="358" y2="185" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="334" y="178" text-anchor="middle" font-size="9" fill="#374151">HTTP</text>

  <!-- MySQL -->
  <rect x="90" y="270" width="220" height="90" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="200" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#581c87">Servidor de base de datos</text>
  <text x="200" y="317" text-anchor="middle" font-size="11" fill="#581c87">MySQL Server</text>
  <text x="200" y="333" text-anchor="middle" font-size="10" fill="#581c87">Puerto :3306 &middot; BD "pepito_plus"</text>

  <line x1="475" y1="230" x2="200" y2="268" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="340" y="255" text-anchor="middle" font-size="9" fill="#374151">TCP/IP (pymysql)</text>

  <!-- Filesystem / venv -->
  <rect x="360" y="270" width="230" height="90" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="475" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Entorno de ejecución</text>
  <text x="475" y="317" text-anchor="middle" font-size="11" fill="#713f12">Python 3.12 + venv</text>
  <text x="475" y="333" text-anchor="middle" font-size="10" fill="#713f12">Flask, SQLAlchemy, requests, bs4</text>

  <line x1="475" y1="230" x2="475" y2="268" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)" stroke-dasharray="3,2"/>

  <!-- Git/GitHub -->
  <rect x="90" y="400" width="500" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="340" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Control de versiones</text>
  <text x="340" y="448" text-anchor="middle" font-size="11" fill="#7f1d1d">Repositorio Git local &#8596; GitHub (remoto)</text>

  <line x1="475" y1="360" x2="400" y2="398" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)" stroke-dasharray="3,2"/>

  <!-- Internet / external sources -->
  <rect x="680" y="140" width="240" height="220" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="800" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Internet</text>
  <text x="800" y="182" text-anchor="middle" font-size="10" fill="#374151">Red externa (WAN)</text>

  <rect x="700" y="200" width="200" height="55" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <text x="800" y="223" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Fuentes públicas (RF2)</text>
  <text x="800" y="240" text-anchor="middle" font-size="9" fill="#374151">Ej: eltiempo.com</text>

  <rect x="700" y="270" width="200" height="55" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <text x="800" y="293" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Servidores DNS / HTTP</text>
  <text x="800" y="310" text-anchor="middle" font-size="9" fill="#374151">Resolución y entrega de contenido</text>

  <line x1="590" y1="185" x2="700" y2="220" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="640" y="192" text-anchor="middle" font-size="9" fill="#374151">HTTPS</text>

  <!-- Leyenda -->
  <rect x="60" y="490" width="840" height="130" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="76" y="512" font-size="12" font-weight="700" fill="#111827">Notas de infraestructura:</text>
  <text x="76" y="532" font-size="11" fill="#374151">- Despliegue de un solo nodo: aplicación web, base de datos y entorno de ejecución conviven en el mismo equipo (entorno de desarrollo/pruebas).</text>
  <text x="76" y="550" font-size="11" fill="#374151">- El pool de workers del crawler consume ancho de banda saliente hacia Internet para descargar páginas de las fuentes activas (RF3).</text>
  <text x="76" y="568" font-size="11" fill="#374151">- La conexión a MySQL usa el driver pymysql sobre TCP/IP en el puerto 3306, dentro del mismo host (no expuesta a la red externa).</text>
  <text x="76" y="586" font-size="11" fill="#374151">- El código fuente se versiona con Git y se respalda en GitHub; las credenciales (.env) se excluyen del repositorio por seguridad.</text>
  <text x="76" y="604" font-size="11" fill="#374151">- Para un despliegue en producción, cada bloque (app, base de datos) podría separarse en servidores/contenedores distintos.</text>
</svg>
