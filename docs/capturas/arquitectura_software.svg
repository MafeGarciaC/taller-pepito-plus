<svg viewBox="0 0 960 800" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="960" height="800" fill="#f9fafb"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">
    Diagrama de Arquitectura de Software — Pepito Plus
  </text>

  <!-- Capa Cliente -->
  <rect x="60" y="60" width="840" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Capa de Presentación (Cliente)</text>
  <text x="480" y="112" text-anchor="middle" font-size="12" fill="#1e3a8a">Navegador Web — plantillas Jinja2 (HTML + CSS servidas por Flask)</text>

  <line x1="480" y1="130" x2="480" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="155" x2="480" y2="130" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Capa Aplicacion -->
  <rect x="60" y="160" width="840" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="480" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Capa de Aplicación (Flask)</text>
  <text x="480" y="212" text-anchor="middle" font-size="12" fill="#14532d">app/routes.py — Blueprint con rutas HTTP (RF1, RF2, RF3, RF9)</text>

  <line x1="300" y1="230" x2="300" y2="255" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="230" x2="660" y2="255" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Capa Servicios -->
  <rect x="60" y="260" width="400" height="100" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="260" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Capa de Servicios (lógica de negocio)</text>
  <text x="260" y="305" text-anchor="middle" font-size="11" fill="#713f12">services/matching.py — RF5</text>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#713f12">services/identity.py — RF7</text>
  <text x="260" y="339" text-anchor="middle" font-size="11" fill="#713f12">services/classifier.py — RF8</text>

  <!-- Capa Crawler -->
  <rect x="500" y="260" width="400" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="700" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Capa de Concurrencia (Crawler)</text>
  <text x="700" y="305" text-anchor="middle" font-size="11" fill="#7f1d1d">crawler/__init__.py — ThreadPoolExecutor (RF3)</text>
  <text x="700" y="322" text-anchor="middle" font-size="11" fill="#7f1d1d">crawler/queue_manager.py — Queue + Lock (RF3, RF4)</text>
  <text x="700" y="339" text-anchor="middle" font-size="11" fill="#7f1d1d">crawler/worker.py — reclamo de URLs (RF4)</text>

  <line x1="260" y1="360" x2="480" y2="395" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="360" x2="480" y2="395" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Capa Persistencia -->
  <rect x="60" y="400" width="840" height="70" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="480" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">Capa de Persistencia (ORM)</text>
  <text x="480" y="452" text-anchor="middle" font-size="12" fill="#312e81">app/models.py — SQLAlchemy (Persona, Fuente, Busqueda, Url, Documento, DocumentoAnalisis, MetricaConcurrencia)</text>

  <line x1="480" y1="470" x2="480" y2="495" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Capa Datos -->
  <rect x="300" y="500" width="360" height="70" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="480" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#581c87">Capa de Datos</text>
  <text x="480" y="552" text-anchor="middle" font-size="12" fill="#581c87">MySQL — base de datos "pepito_plus"</text>

  <!-- Fuentes externas -->
  <line x1="700" y1="360" x2="820" y2="620" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="700" y="620" width="240" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="820" y="650" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Fuentes externas</text>
  <text x="820" y="670" text-anchor="middle" font-size="11" fill="#374151">Sitios web públicos (Internet)</text>

  <!-- Leyenda -->
  <rect x="60" y="600" width="600" height="130" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="76" y="622" font-size="12" font-weight="700" fill="#111827">Flujo de datos:</text>
  <text x="76" y="642" font-size="11" fill="#374151">1. El usuario interactúa con el navegador (formularios: personas, fuentes, búsquedas).</text>
  <text x="76" y="660" font-size="11" fill="#374151">2. Flask recibe la petición y la enruta en routes.py.</text>
  <text x="76" y="678" font-size="11" fill="#374151">3. El orquestador del crawler reparte URLs entre N workers (threads) usando la cola compartida.</text>
  <text x="76" y="696" font-size="11" fill="#374151">4. Cada worker descarga contenido externo, lo analiza con los servicios (RF5-RF8) y lo persiste vía ORM.</text>
  <text x="76" y="714" font-size="11" fill="#374151">5. RF9 consulta los datos persistidos aplicando filtros sobre las mismas tablas.</text>
</svg>
